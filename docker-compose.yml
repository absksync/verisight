version: "3.9"

services:
  verisight:
    build:
      context: .
      dockerfile: Dockerfile
    image: verisight:latest
    container_name: verisight_app
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded images across restarts
      - ./backend/uploads:/app/backend/uploads
      # Mount trained models so you can update without rebuilding
      - ./models:/app/models
      # Mount reports output
      - ./reports:/app/reports
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
